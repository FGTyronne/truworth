name: TruWorth Storage and Link QA
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright-core@1.56.1
      - name: Validate production storage, artwork and navigation
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          if(!executablePath) throw new Error('Chrome not found');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:390,height:900}});
          const page=await context.newPage();
          const failures=[];

          await page.addInitScript(() => {
            localStorage.setItem('truworth_guest_v1', JSON.stringify({
              records:[{id:'guest-qa',created_at:new Date().toISOString(),title:'QA headphones',observed_price:100,currency:'GBP',score:70,status:'considering',inputs:{item:'QA headphones',price:100,upkeep:0,uses:50,effort:0,joy:7,minutes:0,hourValue:15,motive:'joy',alternative:'',source_url:'',canonical_url:'',image_url:'',currency:'GBP'}}],
              owned:{},settings:{motion:true}
            }));
          });

          await page.goto('https://truworth.vercel.app/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('.tw-home-hero',{timeout:15000});
          await page.waitForTimeout(2300);

          const state=await page.evaluate(() => ({
            local: localStorage.getItem('truworth_guest_v1'),
            session: sessionStorage.getItem('truworth_guest_v1'),
            width: innerWidth,
            scrollWidth: document.documentElement.scrollWidth
          }));
          if(state.local !== null) failures.push('Guest data still persists in localStorage');
          if(!state.session || !state.session.includes('QA headphones')) failures.push('Legacy guest data was not migrated to sessionStorage');
          if(state.scrollWidth > state.width + 2) failures.push(`Home overflow ${state.scrollWidth}>${state.width}`);

          const hero=page.locator('.tw-collage-card img');
          const heroInfo=await hero.evaluate(img=>({src:img.getAttribute('src'),complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}));
          if(!String(heroInfo.src).includes('hero-products.webp')) failures.push(`Wrong hero asset: ${heroInfo.src}`);
          if(!heroInfo.complete || heroInfo.naturalWidth < 800) failures.push(`Hero did not load at expected quality: ${JSON.stringify(heroInfo)}`);
          if(await page.locator('.tw-collage-card .tw-sticker').count()) failures.push('Duplicate hero stickers remain');

          await page.reload({waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('.tw-home-hero',{timeout:15000});
          await page.waitForTimeout(1400);
          const reloadState=await page.evaluate(() => ({local:localStorage.getItem('truworth_guest_v1'),session:sessionStorage.getItem('truworth_guest_v1')}));
          if(reloadState.local !== null) failures.push('Guest localStorage returned after reload');
          if(!reloadState.session || !reloadState.session.includes('QA headphones')) failures.push('Session-only guest state did not survive reload');

          const link=page.locator('.site-footer a',{hasText:'How TruWorth works'});
          if(await link.count() !== 1) failures.push('How TruWorth works footer link missing');
          else {
            await Promise.all([
              page.waitForURL(/decision-support\.html/, {timeout:10000}),
              link.click()
            ]).catch(e=>failures.push(`How TruWorth works click failed: ${e.message}`));
          }

          if(/decision-support\.html/.test(page.url())) {
            const text=await page.locator('body').innerText();
            if(!/How your purchase score is worked out/i.test(text)) failures.push('Decision-support page content not updated');
            if(/Snap\s*&\s*Assess|barcode|on-device text recognition|camera/i.test(text)) failures.push('Removed camera/Snap material remains on decision-support page');
          }

          await browser.close();
          if(failures.length){ console.error('FAILURES\n'+failures.join('\n')); process.exit(1); }
          console.log('TRUWORTH_STORAGE_LINK_QA_PASS');
          EOF
          node qa.mjs