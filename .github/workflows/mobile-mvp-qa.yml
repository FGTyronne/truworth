name: TruWorth Mobile MVP QA
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck native app
        working-directory: mobile
        run: npm run typecheck
      - name: Validate Expo configuration
        working-directory: mobile
        run: npx expo config --type public > /tmp/truworth-expo-config.json
      - name: Bundle Android JavaScript
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-ci

  web-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify Render desktop proportions and launch copy
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const base = 'https://truworth-web.onrender.com';
            const page = await browser.newPage({ viewport: { width: 1920, height: 1080 } });
            await page.goto(base, { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForFunction(() => window.__TRUWORTH_RELEASE_READY__ === true, null, { timeout: 30000 });
            await page.waitForTimeout(2800);

            const desktop = await page.evaluate(() => {
              const h1 = document.querySelector('.tw-home-copy h1');
              const card = document.querySelector('.tw-collage-card');
              const hero = document.querySelector('.tw-home-hero');
              const stat = document.querySelector('.tw-stat-strip article');
              const trust = document.querySelector('.tw-home-trust');
              const rect = el => el ? el.getBoundingClientRect() : null;
              return {
                h1Font: h1 ? parseFloat(getComputedStyle(h1).fontSize) : 0,
                h1: rect(h1), card: rect(card), hero: rect(hero), stat: rect(stat),
                trust: trust?.innerText || '',
                overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth
              };
            });
            console.log('DESKTOP_METRICS', JSON.stringify(desktop));
            assert(desktop.h1Font > 0 && desktop.h1Font <= 65, `Headline font too large: ${desktop.h1Font}`);
            assert(desktop.h1 && desktop.h1.width <= 650, `Headline block too wide: ${desktop.h1?.width}`);
            assert(desktop.card && desktop.card.height <= 400, `Hero artwork card too tall: ${desktop.card?.height}`);
            assert(desktop.hero && desktop.hero.height <= 470, `Hero section too tall: ${desktop.hero?.height}`);
            assert(desktop.stat && desktop.stat.height <= 105, `Proof card too tall: ${desktop.stat?.height}`);
            assert(desktop.overflow <= 2, `Desktop horizontal overflow: ${desktop.overflow}`);
            assert(/Free account/i.test(desktop.trust), `Trust strip missing Free account: ${desktop.trust}`);
            assert(!/No account needed/i.test(desktop.trust), `Legacy account copy remains: ${desktop.trust}`);

            await page.goto(`${base}/plans.html`, { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForFunction(() => window.__TRUWORTH_RELEASE_READY__ === true, null, { timeout: 30000 });
            await page.waitForTimeout(2800);
            const plans = await page.locator('body').innerText();
            assert(/See deeper buying patterns/i.test(plans), 'Simplified Plus buying-pattern heading missing');
            assert(!/Wants You|Real Buyer You|Wants Self|Real Buyer Me/i.test(plans), 'Persona jargon remains on Membership');

            await page.goto(`${base}/assess.html`, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForURL(/account\.html/, { timeout: 30000 });
            console.log('ACCOUNT_GATE_URL', page.url());

            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(base, { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForFunction(() => window.__TRUWORTH_RELEASE_READY__ === true, null, { timeout: 30000 });
            await page.waitForTimeout(2800);
            const mobileOverflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert(mobileOverflow <= 2, `Mobile horizontal overflow: ${mobileOverflow}`);
            console.log('MOBILE_OVERFLOW', mobileOverflow);
            console.log('TRUWORTH_WEB_LAYOUT_PASS');
            await browser.close();
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
