name: TruWorth Mobile Password Hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden native password entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/App.tsx')
          s = p.read_text()
          old = "function Field({ label, value, onChangeText, placeholder, keyboardType = 'default', multiline = false }: { label: string; value: string; onChangeText: (value: string) => void; placeholder?: string; keyboardType?: 'default' | 'numeric' | 'decimal-pad' | 'url' | 'email-address'; multiline?: boolean }) {\n  return <View style={styles.field}><Text style={styles.fieldLabel}>{label}</Text><TextInput value={value} onChangeText={onChangeText} placeholder={placeholder} placeholderTextColor=\"#9A9FB1\" keyboardType={keyboardType} autoCapitalize={keyboardType === 'email-address' || keyboardType === 'url' ? 'none' : 'sentences'} autoCorrect={false} multiline={multiline} style={[styles.input, multiline && styles.multiline]} /></View>;\n}"
          new = "function Field({ label, value, onChangeText, placeholder, keyboardType = 'default', multiline = false, secure = false }: { label: string; value: string; onChangeText: (value: string) => void; placeholder?: string; keyboardType?: 'default' | 'numeric' | 'decimal-pad' | 'url' | 'email-address'; multiline?: boolean; secure?: boolean }) {\n  return <View style={styles.field}><Text style={styles.fieldLabel}>{label}</Text><TextInput value={value} onChangeText={onChangeText} placeholder={placeholder} placeholderTextColor=\"#9A9FB1\" keyboardType={keyboardType} secureTextEntry={secure} autoCapitalize={secure || keyboardType === 'email-address' || keyboardType === 'url' ? 'none' : 'sentences'} autoCorrect={false} multiline={multiline} style={[styles.input, multiline && styles.multiline]} /></View>;\n}"
          if old not in s:
              raise SystemExit('Field signature not found')
          s = s.replace(old, new)
          old_password = "<Field label=\"Password\" value={password} onChangeText={setPassword} placeholder={mode === 'signup' ? '8+ characters' : 'Your password'} />"
          new_password = "<Field label=\"Password\" value={password} onChangeText={setPassword} placeholder={mode === 'signup' ? '8+ characters' : 'Your password'} secure />"
          if old_password not in s:
              raise SystemExit('Password field not found')
          s = s.replace(old_password, new_password)
          p.write_text(s)
          PY
      - name: Commit hardening if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Tyronne Ramella"
          git config user.email "89127492+FGTyronne@users.noreply.github.com"
          git add mobile/App.tsx
          git commit -m "Harden native password entry"
          git push
