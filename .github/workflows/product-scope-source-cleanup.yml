name: TruWorth Product Scope Source Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-product MVP language
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'release-v6.js': [
              ('Find a product or service', 'Find a product'),
              ('Headphones. A holiday. A new phone. A gym membership. A ridiculously expensive coffee machine. Anything works.', 'Headphones. A new phone. Trainers. A handbag. A coffee machine. Start with a product you are actually considering.'),
              ('Look for a product or service first, then bring the link back into TruWorth.', 'Look for a product first, then bring the link back into TruWorth.'),
            ],
            'experience-v18.js': [
              ('Check anything from headphones and holidays to subscriptions and home upgrades. TruWorth turns the purchase into a clear, consistent decision.', 'Check products like headphones, phones, trainers, bags, skincare and home tech. TruWorth gives you a clear score based on the details you enter.'),
            ],
            'patch-v9.js': [
              ('Choose the exact product or service, copy its page link, then paste it below.', 'Choose the exact product, copy its page link, then paste it below.'),
            ],
            'NEXT_PATCH.md': [
              ('Find a product or service flow', 'Find a product flow'),
              ('Product/service terminology across the assessor where appropriate.', 'Product terminology across the assessor.'),
            ],
            'decision-support.html': [
              ('          <p>Travel, holidays, subscriptions and general services are not part of the current scoring model. They may be added later with scoring designed specifically for those types of decisions.</p>\n', ''),
            ],
            'mobile/README.md': [
              ('The assessment model is intentionally limited to **physical consumer products**: technology, fashion, home products, beauty, fitness equipment, gaming products and similar goods. Travel, holidays, subscriptions and general services are deferred until they have scoring designed for those decisions.', 'The assessment model is intentionally limited to **physical consumer products**: technology, fashion, home products, beauty, fitness equipment, gaming products and similar goods.'),
            ],
          }

          for name, pairs in replacements.items():
            p = Path(name)
            if not p.exists():
              continue
            s = p.read_text()
            for old, new in pairs:
              s = s.replace(old, new)
            p.write_text(s)
          PY
      - name: Commit source cleanup
        run: |
          git config user.name "Tyronne Ramella"
          git config user.email "89127492+FGTyronne@users.noreply.github.com"
          git rm .github/workflows/product-scope-source-cleanup.yml
          git add release-v6.js experience-v18.js patch-v9.js NEXT_PATCH.md decision-support.html mobile/README.md
          git commit -m "Keep MVP focused on physical products"
          git push
