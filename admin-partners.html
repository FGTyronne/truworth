<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">

  <title>Partner & commercial admin | TruWorth</title>
  <link rel="stylesheet" href="app.css?v=20261015h">
  <style>
    body{background:#fcf9f4;color:#101b4d;font-family:Inter,system-ui,sans-serif}.partner-admin-shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 60px}.partner-admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.partner-admin-brand{font-size:1.35rem;font-weight:900;color:#101b4d;text-decoration:none}.partner-admin-back{color:#101b4d;font-weight:800}.partner-admin-panel{background:#fff;border:1px solid rgba(16,27,77,.1);border-radius:24px;padding:22px}.partner-admin-overview{margin-bottom:18px}.partner-admin-toolbar,.partner-admin-section-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.partner-admin-toolbar h2,.partner-admin-section-head h2{margin:3px 0 0}.partner-admin-filter{display:flex;gap:8px;flex-wrap:wrap}.partner-admin-filter button{border:1px solid rgba(16,27,77,.14);background:#fff;border-radius:999px;padding:8px 11px;font:inherit;cursor:pointer}.partner-admin-filter button.active{background:#101b4d;color:#fff}.partner-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 28px}.partner-metric{border:1px solid rgba(16,27,77,.09);border-radius:18px;padding:16px;background:#fcfcf8}.partner-metric>span{display:block;color:#68708a;font-size:.78rem;font-weight:800}.partner-metric>strong{display:block;margin-top:5px;font-size:1.45rem;color:#101b4d}.partner-metric small{display:block;margin-top:4px;color:#8a8f9e}.partner-admin-note{font-size:.82rem;color:#7a5a07;background:#fff8e7;border-radius:14px;padding:12px 14px}.partner-campaign-list,.partner-admin-list{display:grid;gap:12px}.partner-campaign{border:1px solid rgba(16,27,77,.09);border-radius:17px;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.partner-campaign>div:first-child>strong{display:block}.partner-campaign>div:first-child>span{display:block;margin-top:4px;color:#68708a;font-size:.8rem}.partner-campaign-numbers{display:flex;gap:16px;flex-wrap:wrap}.partner-campaign-numbers span{font-size:.76rem;color:#68708a}.partner-campaign-numbers strong{display:block;color:#101b4d;font-size:1rem}.partner-enquiry{border:1px solid rgba(16,27,77,.1);border-radius:18px;padding:18px;display:grid;gap:12px}.partner-enquiry-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.partner-enquiry h2{font-size:1rem;margin:0}.partner-enquiry-meta{color:#68708a;font-size:.82rem}.partner-enquiry-message{white-space:pre-wrap;line-height:1.5;color:#343b56}.partner-enquiry-actions{display:flex;gap:8px;flex-wrap:wrap}.partner-enquiry-actions select{border:1px solid rgba(16,27,77,.16);border-radius:12px;padding:9px 11px;background:#fff}.partner-enquiry a{color:#101b4d}.status-pill{font-size:.72rem;font-weight:800;border-radius:999px;padding:6px 9px;background:#f0f1ef}.partner-admin-loading,.partner-admin-empty{padding:32px;text-align:center;color:#68708a}.partner-admin-error{color:#a3261c}@media(max-width:800px){.partner-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.partner-campaign{grid-template-columns:1fr}}@media(max-width:680px){.partner-enquiry-head{display:grid}.partner-metrics{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="partner-admin-shell">
    <header class="partner-admin-header"><a class="partner-admin-brand" href="account.html">TruWorth</a><a class="partner-admin-back" href="account.html">Back to account</a></header>
    <section id="partnerAdminApp" aria-live="polite"><div class="partner-admin-loading">Checking access…</div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script defer src="admin-partners.js?v=20261015h"></script>
</body>
</html>
