name: Web static smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Render artifact
        run: bash render-build.sh
      - name: Verify Render artifact
        run: |
          test -f dist-web/index.html
          test -f dist-web/app.js
          test -f dist-web/app.css
          test -f dist-web/favicon.svg
          test -f dist-web/robots.txt
          test -f dist-web/sitemap.xml
          test -f dist-web/security.txt
          test -f dist-web/.well-known/security.txt
          test -f dist-web/member-benefits.html
          test -f dist-web/partner-with-truworth.html
          test -f dist-web/release.txt
          test "$(cat dist-web/release.txt)" = "$GITHUB_SHA"
      - name: Run static launch checks
        run: node scripts/web-static-smoke.mjs
      - name: Run public SEO checks
        run: node scripts/public-seo-smoke.mjs
      - name: Run recommendation outcome checks
        run: node scripts/decision-outcome-smoke.mjs
