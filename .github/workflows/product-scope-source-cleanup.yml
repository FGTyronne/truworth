name: TruWorth Product Scope Source Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove deferred use cases from active source
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('mobile/App.tsx')
          s = p.read_text()
          s = s.replace('copy="The MVP is focused on physical consumer products."', 'copy="Tech, fashion, home, beauty, fitness and gaming products."')
          s = s.replace('copy="Your signed-in purchase history is stored in Supabase. The native app keeps only the authentication session in secure device storage."', 'copy="Sign in to keep your saved assessments and purchase history synced across devices."')
          s = s.replace('<View style={styles.proofRow}><Text style={styles.proof}>✓ About 2 minutes</Text><Text style={styles.proof}>✓ Clear 0–100 score</Text></View>', '<View style={styles.proofRow}><Text style={styles.proof}>✓ No account needed</Text><Text style={styles.proof}>✓ About 2 minutes</Text><Text style={styles.proof}>✓ Clear 0–100 score</Text></View>')
          p.write_text(s)

          p = Path('experience-v17.js')
          s = p.read_text()
          s = s.replace('Pressure-test anything from headphones and holidays to subscriptions and home upgrades. TruWorth turns the decision into something you can actually compare.', 'Check products like headphones, phones, trainers, bags, skincare and home tech. TruWorth gives you a clear score based on the details you enter.')
          s = s.replace("['✈️', 'Travel', 'holiday']", "['🎮', 'Gaming', 'game controller']")
          s = s.replace('Type the item, service or subscription and what it costs.', 'Type the product and what it costs.')
          s = s.replace('<span>🏖️ Holiday</span>', '<span>🎮 Game controller</span>')
          s = s.replace('Headphones, trainers, skincare, coffee machine, holiday, gym membership', 'Headphones, trainers, skincare, coffee machine, handbag, game controller')
          p.write_text(s)

          p = Path('release-v6.js')
          s = p.read_text().replace('Look for a product or service first, then bring the link back into TruWorth.', 'Look for a product first, then bring the link back into TruWorth.')
          p.write_text(s)

          p = Path('decision-support.html')
          s = p.read_text().replace('The MVP is designed for physical consumer products:', 'TruWorth currently assesses physical consumer products:')
          p.write_text(s)
          PY
      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Tyronne Ramella"
          git config user.email "89127492+FGTyronne@users.noreply.github.com"
          git add mobile/App.tsx experience-v17.js release-v6.js decision-support.html
          git commit -m "Keep active product scope consistent"
          git push
