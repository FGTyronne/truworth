name: TruWorth UI QA
on:
  push:
    paths:
      - '.github/workflows/ui-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Run production UI checks
        run: |
          cat > ui-qa.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
          const executablePath=candidates.find((p)=>fs.existsSync(p));
          if(!executablePath) throw new Error('No Chrome/Chromium executable found');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const pages=[
            ['home','https://truworth.vercel.app/','.tw-home-hero'],
            ['assess','https://truworth.vercel.app/assess.html','.tw-assess-examples'],
            ['library','https://truworth.vercel.app/watchlist.html','.library-toolbar'],
            ['insights','https://truworth.vercel.app/insights.html','.main-content'],
            ['account','https://truworth.vercel.app/account.html','.main-content']
          ];
          const widths=[320,390,430,1024];
          const failures=[];
          for(const [name,url,selector] of pages){
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:900}});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
              page.on('console',m=>{if(m.type()==='error' && !/favicon/i.test(m.text())) errors.push(`console:${m.text()}`)});
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              if(!response || !response.ok()) failures.push(`${name}@${width}: HTTP ${response?.status()}`);
              try{await page.waitForSelector('.tw17',{timeout:10000});}catch{failures.push(`${name}@${width}: .tw17 missing`)}
              try{await page.waitForSelector(selector,{timeout:10000});}catch{failures.push(`${name}@${width}: ${selector} missing`)}
              await page.waitForTimeout(250);
              const metrics=await page.evaluate(()=>({
                innerWidth:window.innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                hasBottomNav:!!document.querySelector('.bottom-nav'),
                bottomNavDisplay:getComputedStyle(document.querySelector('.bottom-nav')).display,
                collageLoaded:!document.querySelector('.tw-collage-card img') || document.querySelector('.tw-collage-card img').complete
              }));
              if(metrics.scrollWidth>metrics.innerWidth+3) failures.push(`${name}@${width}: horizontal overflow ${metrics.scrollWidth}>${metrics.innerWidth}`);
              if(width<=430 && (!metrics.hasBottomNav || metrics.bottomNavDisplay==='none')) failures.push(`${name}@${width}: visible bottom nav missing`);
              if(name==='home' && !metrics.collageLoaded) failures.push(`${name}@${width}: collage did not load`);
              if(errors.length) failures.push(`${name}@${width}: ${errors.join(' | ')}`);
              console.log(JSON.stringify({name,width,scrollWidth:metrics.scrollWidth,innerWidth:metrics.innerWidth,bottomNav:metrics.bottomNavDisplay,ok:!failures.some(f=>f.startsWith(`${name}@${width}:`))}));
              await context.close();
            }
          }
          const context=await browser.newContext({viewport:{width:390,height:900}});
          const home=await context.newPage();
          await home.goto('https://truworth.vercel.app/',{waitUntil:'domcontentloaded'});
          await home.waitForSelector('.tw-home-hero',{timeout:10000});
          await home.getByRole('link',{name:/Start assessment/i}).first().click();
          await home.waitForURL(/assess\.html/,{timeout:15000});
          await home.waitForSelector('#assessment',{timeout:10000});
          if(!await home.locator('#assessment').count()) failures.push('Home CTA did not reach working assessment form');
          await context.close();
          await browser.close();
          if(failures.length){console.error('FAILURES\n'+failures.join('\n'));process.exit(1)}
          console.log('UI_QA_PASS');
          EOF
          node ui-qa.mjs
