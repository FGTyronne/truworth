name: TruWorth Trial QA
on:
  push:
    paths:
      - '.github/workflows/trial-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - name: Check live trial presentation
        run: |
          cat > trial-qa.mjs <<'EOF'
          import { chromium } from 'playwright-core'; import fs from 'fs';
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:390,height:900}});
          const page=await context.newPage();
          const errors=[]; page.on('pageerror',e=>errors.push(e.message)); page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))errors.push(m.text())});
          const response=await page.goto('https://truworth.vercel.app/plans.html',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('.membership-sheet',{timeout:12000}); await page.waitForTimeout(1200);
          const text=await page.locator('body').innerText();
          const buttons=await page.locator('.billing-checkout').allTextContents();
          const metrics=await page.evaluate(()=>({w:innerWidth,sw:document.documentElement.scrollWidth}));
          const failures=[];
          if(!response?.ok()) failures.push(`HTTP ${response?.status()}`);
          if(!/3 days free/i.test(text) && !/3-day free trial/i.test(text)) failures.push('Trial copy missing');
          if(!text.includes('£5.99')||!text.includes('£59.99')) failures.push('Post-trial prices missing');
          if(!buttons.some(x=>/3-day free trial/i.test(x))) failures.push('Trial CTA missing');
          if(!/cancel before the trial ends/i.test(text)) failures.push('Cancellation disclosure missing');
          if(metrics.sw>metrics.w+2) failures.push('Mobile horizontal overflow');
          if(errors.length) failures.push('Page errors: '+errors.join(' | '));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('TRIAL_QA_PASS');
          EOF
          node trial-qa.mjs
