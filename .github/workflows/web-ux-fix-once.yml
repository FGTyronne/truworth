# one-off workflow trigger
name: TruWorth Web UX Correction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-ux-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct desktop scale, account messaging and buyer-pattern copy
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if required:
                      raise SystemExit(f'Missing expected text in {path}: {old[:120]}')
                  return False
              p.write_text(text.replace(old, new))
              return True

          replace('experience-v17.js', "['No login', 'Try it first', 'Save your results if you want']", "['Free', 'Your account', 'Keeps your assessments saved']", required=False)
          replace('experience-v17.js', '<div class="tw-home-trust"><span>✓ No account needed</span><span>✓ About 2 minutes</span><span>✓ Clear 0–100 score</span></div>', '<div class="tw-home-trust"><span>✓ Free account</span><span>✓ About 2 minutes</span><span>✓ Clear 0–100 score</span></div>', required=False)
          replace('experience-v17.js', "'Sign in when you want your assessments available across devices.'", "'Create an account or sign in to use TruWorth and keep your assessments saved.'", required=False)
          replace('experience-v18.js', "<span><b>✓</b>No account needed</span><span><b>✓</b>About 2 minutes</span><span><b>✓</b>Clear 0–100 score</span>", "<span><b>✓</b>Free account</span><span><b>✓</b>About 2 minutes</span><span><b>✓</b>Clear 0–100 score</span>", required=False)
          replace('experience-v18.js', "'Try it first': 'Save your results if you want'", "'Your account': 'Keeps your assessments saved'", required=False)
          replace('experience-v21.js', "<span><b>✓</b>No account needed</span><span><b>✓</b>About 2 minutes</span><span><b>✓</b>Clear 0–100 score</span>", "<span><b>✓</b>Free account</span><span><b>✓</b>About 2 minutes</span><span><b>✓</b>Clear 0–100 score</span>", required=False)
          replace('copy-v19.js', "<span><b>✓</b>No account needed</span><span><b>✓</b>About 2 minutes</span><span><b>✓</b>Clear 0–100 score</span>", "<span><b>✓</b>Free account</span><span><b>✓</b>About 2 minutes</span><span><b>✓</b>Clear 0–100 score</span>", required=False)
          replace('copy-v19.js', "'Try it first': 'Save your results if you want'", "'Your account': 'Keeps your assessments saved'", required=False)
          replace('release-v6.js', '<div class="home-trust"><span>No account needed to try it</span><span>About 2 minutes</span><span>Save later if you want</span></div>', '<div class="home-trust"><span>Free account</span><span>About 2 minutes</span><span>Clear 0–100 score</span></div>', required=False)
          replace('release-v6.js', 'Paste it into the assessor. Sign in only if you want automatic page import and cloud saving.', 'Paste it into the assessor. Your assessment stays with your account.', required=False)
          replace('release-v6.js', "const motiveLabel = (m) => m === 'need' ? 'Practical' : m === 'joy' ? 'Joy-led' : m === 'image' ? 'Impulse-led' : 'Exploring';", "const motiveLabel = (m) => m === 'need' ? 'Practical' : m === 'joy' ? 'For enjoyment' : m === 'image' ? 'Impulse/status' : 'Not enough data';")
          replace('release-v6.js', "real: bought.length ? motiveLabel(realMotive) : 'Still learning',", "real: bought.length ? motiveLabel(realMotive) : 'Not enough data',")
          replace('release-v6.js', '<h2>${snapshot.wants} wants. ${snapshot.real} reality.</h2><p>TruWorth is starting to learn the difference between what catches your eye and what you actually buy.</p>', '<h2>What catches your eye vs what you buy</h2><p>TruWorth compares the products you assess with the ones you mark as bought.</p>', required=False)
          replace('release-v6.js', '<h2>Your “Wants Me” and “Real Buyer Me” won’t always be the same.</h2><p>Use TruWorth a few times and the app will start showing the gap between what tempts you, what you buy and what actually fits.</p>', '<h2>See your buying patterns over time.</h2><p>TruWorth compares the products you assess with the ones you mark as bought.</p>', required=False)
          replace('release-v6.js', "if (!records.length) return 'Your buyer profile starts with your first assessment.';\n    if (!snapshot.boughtCount) return `Your Wants Self currently looks ${snapshot.wants.toLowerCase()}. We need a purchase or two to meet your Real Buyer.`;\n    if (snapshot.wants !== snapshot.real) return `You browse like a ${snapshot.wants.toLowerCase()} buyer, but spend like a ${snapshot.real.toLowerCase()} one.`;\n    return `What tempts you and what you actually buy are currently telling the same ${snapshot.wants.toLowerCase()} story.`;", "if (!records.length) return 'Complete a few assessments to start seeing your buying patterns.';\n    if (!snapshot.boughtCount) return 'Mark something as bought when you purchase it. TruWorth will then compare what you consider with what you actually buy.';\n    if (snapshot.wants !== snapshot.real) return 'Your assessment history and purchase history are showing different patterns.';\n    return 'Your assessment history and purchase history are currently showing a similar pattern.';")
          replace('release-v6.js', '<div class="premium-unlocked-head"><span>TruWorth+ Buyer Profile</span><strong>${esc(p.wants)} Wants You · ${esc(p.real)} Real Buyer</strong></div>', '<div class="premium-unlocked-head"><span>TruWorth+ buying patterns</span><strong>What you consider: ${esc(p.wants)} · What you buy: ${esc(p.real)}</strong></div>', required=False)
          replace('release-v6.js', '<p class="kicker">Wants You vs Real Buyer You</p>', '<p class="kicker">Your buying patterns</p>')
          replace('release-v6.js', '<div class="buyer-identities"><div class="identity-bubble wants"><span>Wants You</span><strong>${esc(snapshot.wants)}</strong><small>Based on what you consider</small></div><div class="identity-bridge">vs</div><div class="identity-bubble real"><span>Real Buyer You</span><strong>${esc(snapshot.real)}</strong><small>Based on what you actually buy</small></div></div>', '<div class="buyer-identities"><div class="identity-bubble wants"><span>What you consider</span><strong>${esc(snapshot.wants)}</strong><small>From your saved assessments</small></div><div class="identity-bridge">vs</div><div class="identity-bubble real"><span>What you buy</span><strong>${esc(snapshot.real)}</strong><small>From purchases you mark as bought</small></div></div>')
          replace('release-v6.js', '<h2>${esc(snapshot.wants)} Wants You. ${esc(snapshot.real)} Real Buyer.</h2>', '<h2>Considering: ${esc(snapshot.wants)} · Buying: ${esc(snapshot.real)}</h2>')
          replace('release-v6.js', '>Open Buyer Profile</a>', '>View my patterns</a>')
          replace('release-v6.js', 'Full Wants You vs Real Buyer analysis, financial-fit habits, recurring temptation patterns, behaviour over time, personalised warnings and unlimited saved history.', 'Compare what you consider with what you actually buy, see financial-fit habits and recurring purchase patterns, and keep unlimited saved history.')
          replace('release-v6.js', 'simple Buyer Profile headline', 'simple buying-pattern summary')
          replace('release-v6.js', '<h2>Understand your behaviour</h2>', '<h2>See your buying patterns</h2>')
          replace('release-v6.js', 'Unlock your full Buyer Profile', 'Unlock your full buying patterns')
          replace('release-v6.js', 'Building your deeper Buyer Profile…', 'Building your buying patterns…')
          replace('mobile/App.tsx', '✓ No account needed', '✓ Free account', required=False)

          route_old = "function route() {\n  const routes = {"
          route_new = "function route() {\n  const privatePages = new Set(['assess','result','compare','watchlist','owned','insights','settings']);\n  if (!user && privatePages.has(page())) {\n    sessionStorage.setItem('truworth-return-to', `${location.pathname.split('/').pop() || 'index.html'}${location.search || ''}`);\n    location.href = 'account.html';\n    return;\n  }\n  const routes = {"
          replace('account-v2.js', route_old, route_new)
          replace('account-v2.js', "  await syncGuestRecords();\n  location.href = 'index.html';", "  await syncGuestRecords();\n  const returnTo = sessionStorage.getItem('truworth-return-to') || 'index.html';\n  sessionStorage.removeItem('truworth-return-to');\n  location.href = returnTo;")

          Path('theme-v23.css').write_text(r'''/* TruWorth wide-screen calibration. Mobile/tablet rules remain in the existing themes. */
@media (min-width:1024px){
  .tw17 .app-shell{max-width:1240px;padding-left:32px;padding-right:32px}
  .tw17 .main-content{padding-top:12px}
  .tw17 .tw-home-hero{grid-template-columns:minmax(0,.98fr) minmax(420px,.82fr);gap:56px;align-items:center;padding:24px 0 18px;min-height:0}
  .tw17 .tw-eyebrow{margin-bottom:14px;padding:7px 11px;font-size:12px}
  .tw17 .tw-home-copy h1{font-size:clamp(52px,4.2vw,64px);line-height:1;letter-spacing:-2.6px;max-width:620px}
  .tw17 .tw-home-copy>p{max-width:570px;margin-top:17px;font-size:17px;line-height:1.5}
  .tw17 .tw-home-actions{margin-top:21px}
  .tw17 .tw-home-actions .tw-big-cta{min-width:205px}
  .tw17 .tw-home-actions .tw-example-cta{min-width:170px}
  .tw17 .tw-home-trust{gap:16px;margin-top:15px;font-size:12px}
  .tw17 .tw-collage-card{min-height:340px;max-height:390px;border-radius:28px;padding:24px}
  .tw17 .tw-collage-card img{width:min(100%,430px);max-height:330px;object-fit:contain;transform:none}
  .tw17 .tw-stat-strip{gap:12px;margin:8px 0 28px}
  .tw17 .tw-stat-strip article{min-height:82px;padding:14px 16px;border-radius:18px}
  .tw17 .tw-stat-icon{width:38px;height:38px;border-radius:12px;font-size:17px}
  .tw17 .tw-stat-strip strong{font-size:19px}
  .tw17 .tw-stat-strip b{font-size:12px}
  .tw17 .tw-stat-strip small{font-size:11px}
  .tw17 .tw-home-section{margin-top:30px}
}
@media (min-width:1440px){
  .tw17 .app-shell{max-width:1280px}
  .tw17 .tw-home-hero{grid-template-columns:minmax(0,1fr) minmax(430px,.82fr);gap:66px}
}
''')

          app_css = Path('app.css')
          css = app_css.read_text()
          if "theme-v23.css" not in css:
              css += "@import url('theme-v23.css?v=20261014b');\n"
          app_css.write_text(css)
          replace('app.js', "const version='20261014a';", "const version='20261014b';")
          Path('.github/workflows/web-ux-fix-once.yml').unlink()
          PY
      - name: Verify removed copy and syntax
        run: |
          ! grep -R "No account needed\|No account needed to try it\|Wants You\|Real Buyer You\|Wants Self\|Real Buyer Me" --include='*.js' --include='*.tsx' .
          node --check release-v6.js
          node --check experience-v17.js
          node --check experience-v18.js
          node --check experience-v21.js
          node --check copy-v19.js
          node --check account-v2.js
          test -f theme-v23.css
      - name: Commit product corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct web proportions and simplify buying patterns"
          git push