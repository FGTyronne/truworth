name: TruWorth Copy QA
on:
  push:
    paths:
      - '.github/workflows/copy-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - name: Check production copy
        run: |
          cat > copy-qa.mjs <<'EOF'
          import { chromium } from 'playwright-core'; import fs from 'fs';
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:390,height:900}});
          const banned=[/pressure-test/i,/pressure-tested/i,/hurting the case/i,/no ads steering/i,/spreadsheet energy/i,/checkout answer/i,/helping or hurting the case/i];
          const failures=[];
          for(const url of ['https://truworth.vercel.app/','https://truworth.vercel.app/watchlist.html','https://truworth.vercel.app/assess.html']){
            const page=await context.newPage();
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1800);
            const text=await page.locator('body').innerText();
            for(const pattern of banned){ if(pattern.test(text)) failures.push(`${url}: ${pattern}`); }
            await page.close();
          }
          await browser.close();
          if(failures.length){ console.error(failures.join('\n')); process.exit(1); }
          console.log('COPY_QA_PASS');
          EOF
          node copy-qa.mjs
