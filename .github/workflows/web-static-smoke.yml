name: Web static smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: |
          node --check app.js
          node --check partner-enquiry.js
          node --check admin-partners.js
          node --check launch-hardening-v31.js
          node --check commercial-v32.js
          node --check consent-v25.js
          node --check consent-route-v25.js
          node --check ux-v33.js
          node --check footer-nav-v34.js
      - name: Build Render artifact
        run: bash render-build.sh
      - name: Verify Render artifact
        run: |
          test -f dist-web/index.html
          test -f dist-web/app.js
          test -f dist-web/app.css
          test -f dist-web/ux-v33.js
          test -f dist-web/theme-v33.css
          test -f dist-web/footer-nav-v34.js
          test -f dist-web/theme-v34.css
          test -f dist-web/assets/hero-products.webp
          test -f dist-web/favicon.svg
          test -f dist-web/robots.txt
          test -f dist-web/sitemap.xml
          test -f dist-web/security.txt
          test -f dist-web/.well-known/security.txt
          test -f dist-web/member-benefits.html
          test -f dist-web/partner-with-truworth.html
          test -f dist-web/commercial-disclosure.html
          test -f dist-web/admin-partners.html
          test -f dist-web/admin-partners.js
          test -f dist-web/partner-enquiry.js
          test -f dist-web/launch-hardening-v31.js
          test -f dist-web/commercial-v32.js
          test -f dist-web/release.txt
          test "$(cat dist-web/release.txt)" = "$GITHUB_SHA"
          grep -R -F "app.js?v=$GITHUB_SHA" dist-web/*.html >/dev/null
          grep -R -F "app.css?v=$GITHUB_SHA" dist-web/*.html >/dev/null
      - name: Run static launch checks
        run: node scripts/web-static-smoke.mjs
      - name: Run consent contract checks
        run: node scripts/consent-contract-smoke.mjs
      - name: Run public SEO checks
        run: node scripts/public-seo-smoke.mjs
      - name: Run recommendation outcome checks
        run: node scripts/decision-outcome-smoke.mjs
      - name: Run importer contract checks
        run: node scripts/importer-contract-smoke.mjs
      - name: Run commercial boundary checks
        run: node scripts/commercial-boundary-smoke.mjs
      - name: Run admin boundary checks
        run: node scripts/admin-boundary-smoke.mjs
      - name: Run access and commercial contract checks
        run: node scripts/access-commercial-contract-smoke.mjs
