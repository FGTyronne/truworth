name: TruWorth v18 QA
on:
  push:
    paths:
      - '.github/workflows/ui-v18-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - name: Validate live v18 fixes
        run: |
          cat > ui-v18-qa.mjs <<'EOF'
          import { chromium } from 'playwright-core'; import fs from 'fs';
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const failures=[];
          const context=await browser.newContext({viewport:{width:390,height:900}});
          const page=await context.newPage();
          const errors=[]; page.on('pageerror',e=>errors.push(e.message)); page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))errors.push(m.text())});
          await page.goto('https://truworth.vercel.app/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('.tw-home-hero',{timeout:12000}); await page.waitForTimeout(700);
          const home=await page.evaluate(()=>({
            text:document.body.innerText,
            trust:[...document.querySelectorAll('.tw-home-trust span')].map(x=>({text:x.innerText,h:x.getBoundingClientRect().height,w:x.getBoundingClientRect().width})),
            sw:document.documentElement.scrollWidth,w:innerWidth,
            footer:[...document.querySelectorAll('.site-footer a')].map(a=>({text:a.textContent.trim(),href:a.getAttribute('href')}))
          }));
          if(/hurting the case|pressure-tested/i.test(home.text)) failures.push('Old awkward home copy still present');
          if(home.trust.length!==3) failures.push('Home proof row is not 3 items');
          if(Math.max(...home.trust.map(x=>x.h))-Math.min(...home.trust.map(x=>x.h))>2) failures.push('Home proof badges have uneven heights');
          if(home.sw>home.w+2) failures.push('Home horizontal overflow');
          const expected=['privacy.html','terms.html','decision-support.html','plans.html','settings.html'];
          if(expected.some(h=>!home.footer.some(x=>x.href===h))) failures.push('Footer destination missing');

          await page.goto('https://truworth.vercel.app/assess.html',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('#price',{timeout:12000}); await page.waitForTimeout(500);
          const price=await page.evaluate(()=>{
            const input=document.querySelector('#price'); const wrap=input.closest('.money-input'); const symbol=wrap.querySelector(':scope > span:first-child');
            const ir=input.getBoundingClientRect(), sr=symbol.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
            return {inputLeft:ir.left,inputRight:ir.right,symbolRight:sr.right,wrapLeft:wr.left,wrapRight:wr.right,sw:document.documentElement.scrollWidth,w:innerWidth};
          });
          if(price.symbolRight>price.inputLeft+1) failures.push(`Price symbol overlaps input: ${JSON.stringify(price)}`);
          if(price.inputRight>price.wrapRight+1||price.inputLeft<price.wrapLeft-1) failures.push('Price input escapes wrapper');
          if(price.sw>price.w+2) failures.push('Assess horizontal overflow');

          for(const [label,href,heading] of [['Privacy','privacy.html','Privacy'],['Terms','terms.html','Terms'],['How','decision-support.html','What sits behind'],['Membership','plans.html','Membership'],['Settings','settings.html','Settings']]){
            const p=await context.newPage();
            await p.goto('https://truworth.vercel.app/',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForSelector('.site-footer a',{timeout:12000});
            const link=p.locator(`.site-footer a[href="${href}"]`); if(await link.count()!==1){failures.push(`${label} link missing`);await p.close();continue;}
            await link.click();
            try{await p.waitForURL(new RegExp(href.replace('.','\\.')),{timeout:10000});}catch{failures.push(`${label} click did not navigate`);await p.close();continue;}
            await p.waitForTimeout(600);
            const text=(await p.locator('body').innerText()).slice(0,2000);
            if(!text.toLowerCase().includes(heading.toLowerCase())) failures.push(`${label} destination content missing`);
            await p.close();
          }

          await page.goto('https://truworth.vercel.app/account.html',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('.main-content',{timeout:12000}); await page.waitForTimeout(700);
          await page.evaluate(()=>{
            user={email:'averyveryverylong.email.address.for.mobile.qa@example-long-domain.co.uk',created_at:'2026-01-05T12:00:00Z'};
            subscription={tier:'free',status:'active'};
            records=[{id:'1',score:76,status:'considering'},{id:'2',score:68,status:'purchased'}];
            purchases={'2':{assessment_id:'2'}};
            signedInAccountPage();
          });
          await page.waitForTimeout(500);
          const acct=await page.evaluate(()=>({
            sw:document.documentElement.scrollWidth,w:innerWidth,
            email:document.querySelector('.account-profile strong')?.innerText,
            plan:!!document.querySelector('.tw-account-plan'),
            featureCount:document.querySelectorAll('.tw-account-features div').length,
            shortcutCount:document.querySelectorAll('.tw-account-shortcuts a').length,
            emailRight:document.querySelector('.account-profile strong')?.getBoundingClientRect().right,
            profileRight:document.querySelector('.account-profile')?.getBoundingClientRect().right
          }));
          if(acct.sw>acct.w+2) failures.push(`Account horizontal overflow ${acct.sw}>${acct.w}`);
          if(!acct.plan||acct.featureCount<4||acct.shortcutCount<4) failures.push('Free account detail modules missing');
          if(acct.emailRight>acct.profileRight+1) failures.push('Account email overflows profile card');
          if(errors.length) failures.push('Page errors: '+errors.join(' | '));
          await browser.close();
          if(failures.length){console.error('FAILURES\n'+failures.join('\n'));process.exit(1)}
          console.log('V18_QA_PASS');
          EOF
          node ui-v18-qa.mjs
