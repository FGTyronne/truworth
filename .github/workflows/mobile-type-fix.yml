name: TruWorth Mobile Type Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compiler fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/App.tsx')
          s = p.read_text()
          s = s.replace("style={styles.heroImage}", "style={{ width: '100%', aspectRatio: 1.18, borderRadius: 20, backgroundColor: '#F7F7F4', marginTop: 2 }}")
          s = s.replace("fontWeight: '650'", "fontWeight: '600'")
          p.write_text(s)
          PY
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Tyronne Ramella"
          git config user.email "89127492+FGTyronne@users.noreply.github.com"
          git add mobile/App.tsx
          git commit -m "Fix native TypeScript styles"
          git push
