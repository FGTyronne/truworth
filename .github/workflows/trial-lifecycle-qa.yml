name: TruWorth Trial Lifecycle QA
on:
  push:
    paths:
      - '.github/workflows/trial-lifecycle-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - name: Validate live trial lifecycle
        run: |
          cat > trial-lifecycle-qa.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:390,height:900}});
          const failures=[];

          const plans=await context.newPage();
          await plans.goto('https://truworth.vercel.app/plans.html',{waitUntil:'domcontentloaded',timeout:30000});
          await plans.waitForSelector('.membership-sheet',{timeout:12000});
          await plans.waitForTimeout(1200);
          const planText=await plans.locator('body').innerText();
          const planButtons=await plans.locator('.billing-checkout').allTextContents();
          const planMetrics=await plans.evaluate(()=>({w:innerWidth,sw:document.documentElement.scrollWidth}));
          if(!/3-day free trial/i.test(planText)&&!/3 days free/i.test(planText)) failures.push('Trial offer copy missing');
          if(!planText.includes('£5.99')||!planText.includes('£59.99')) failures.push('Trial post-period pricing missing');
          if(!planButtons.some(x=>/3-day free trial/i.test(x))) failures.push('Trial CTA missing');
          if(!/cancel before the trial ends/i.test(planText)) failures.push('Trial cancellation disclosure missing');
          if(planMetrics.sw>planMetrics.w+2) failures.push(`Plans overflow ${planMetrics.sw}>${planMetrics.w}`);
          await plans.close();

          const terms=await context.newPage();
          await terms.goto('https://truworth.vercel.app/terms.html',{waitUntil:'domcontentloaded',timeout:30000});
          const termsText=await terms.locator('body').innerText();
          if(!/one 3-day TruWorth\+ trial/i.test(termsText)) failures.push('Terms trial disclosure missing');
          if(!/final-day in-app reminder/i.test(termsText)) failures.push('Terms reminder disclosure missing');
          await terms.close();

          const page=await context.newPage();
          await page.goto('https://truworth.vercel.app/account.html',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('.main-content',{timeout:12000});
          await page.waitForTimeout(900);
          await page.evaluate(()=>{
            const end=new Date(Date.now()+12*60*60*1000).toISOString();
            user={email:'trial.qa@example.com',created_at:'2026-10-01T12:00:00Z'};
            subscription={tier:'plus',status:'trialing',plan_interval:'month',trial_end:end,current_period_end:end,cancel_at_period_end:false,trial_notice_acknowledged_at:null,provider_subscription_id:'sub_qa'};
            records=[]; purchases={};
            signedInAccountPage();
          });
          await page.evaluate(async()=>{
            await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='trial-v20.js?qa='+Date.now();s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
          });
          await page.waitForSelector('#twTrialNotice',{timeout:8000});
          const noticeText=await page.locator('#twTrialNotice').innerText();
          if(!/trial ends tomorrow/i.test(noticeText)||!noticeText.includes('£5.99')) failures.push('Final-day notice content incorrect');
          await page.locator('[data-trial-review]').click();
          await page.waitForSelector('#twTrialReview',{timeout:5000});
          let reviewText=await page.locator('#twTrialReview').innerText();
          if(!/Keep TruWorth\+/i.test(reviewText)||!/Cancel trial/i.test(reviewText)) failures.push('Trial review choices missing');
          await page.locator('[data-trial-cancel]').click();
          reviewText=await page.locator('#twTrialReview').innerText();
          if(!/Confirm cancellation/i.test(reviewText)||!/no first subscription payment/i.test(reviewText)) failures.push('Cancellation confirmation step incorrect');
          const metrics=await page.evaluate(()=>({w:innerWidth,sw:document.documentElement.scrollWidth}));
          if(metrics.sw>metrics.w+2) failures.push(`Trial review overflow ${metrics.sw}>${metrics.w}`);
          await page.close();

          const cancelled=await context.newPage();
          await cancelled.goto('https://truworth.vercel.app/account.html',{waitUntil:'domcontentloaded',timeout:30000});
          await cancelled.waitForSelector('.main-content',{timeout:12000});
          await cancelled.waitForTimeout(700);
          await cancelled.evaluate(()=>{
            const end=new Date(Date.now()+12*60*60*1000).toISOString();
            user={email:'trial.qa@example.com',created_at:'2026-10-01T12:00:00Z'};
            subscription={tier:'plus',status:'trialing',plan_interval:'month',trial_end:end,current_period_end:end,cancel_at_period_end:true,trial_notice_acknowledged_at:new Date().toISOString(),provider_subscription_id:'sub_qa'};
            records=[]; purchases={};
            signedInAccountPage();
          });
          await cancelled.evaluate(async()=>{await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='trial-v20.js?cancelled='+Date.now();s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});});
          await cancelled.waitForTimeout(400);
          const cancelledText=await cancelled.locator('body').innerText();
          if(await cancelled.locator('#twTrialNotice').count()) failures.push('Reminder still shown after cancellation');
          if(!/Cancellation is scheduled/i.test(cancelledText)||!/no first subscription payment/i.test(cancelledText)) failures.push('Cancelled trial account state incorrect');
          await cancelled.close();

          const unauth=await fetch('https://npfdkbqjoxolxxtmprmr.supabase.co/functions/v1/trial-action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'acknowledge'})});
          if(![401,403].includes(unauth.status)) failures.push(`trial-action unauth status ${unauth.status}`);

          await browser.close();
          if(failures.length){console.error('FAILURES\n'+failures.join('\n'));process.exit(1)}
          console.log('TRIAL_LIFECYCLE_QA_PASS');
          EOF
          node trial-lifecycle-qa.mjs
