name: TruWorth Hero HQ One-Off
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-hq-once.yml'
permissions:
  contents: write
jobs:
  rebuild-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild hero artwork at production resolution
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          p = Path('assets/hero-products.webp')
          img = Image.open(p).convert('RGB')
          target_w = 1024
          target_h = round(img.height * target_w / img.width)
          img = img.resize((target_w, target_h), Image.Resampling.LANCZOS)
          img = img.filter(ImageFilter.UnsharpMask(radius=1.1, percent=105, threshold=3))
          img.save(p, 'WEBP', quality=92, method=6)
          print(f'hero rebuilt: {target_w}x{target_h}, {p.stat().st_size} bytes')
          js = Path('experience-v21.js')
          text = js.read_text()
          import re
          text = re.sub(r"assets/hero-products\.webp\?v=[^']+", "assets/hero-products.webp?v=20261014a", text, count=1)
          js.write_text(text)
          PY
      - name: Commit rebuilt hero
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-products.webp experience-v21.js
          git commit -m 'Improve hero image resolution [hero-hq]' || exit 0
          git push
