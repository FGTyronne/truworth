name: AI Gateway Self Test
on:
  push:
    paths:
      - '.github/workflows/ai-gateway-self-test.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live TruWorth AI Gateway endpoint
        run: |
          set -e
          echo '---BEGIN_RESPONSE---'
          curl --fail-with-body --silent --show-error https://truworth.vercel.app/api/ai-gateway-self-test
          echo
          echo '---END_RESPONSE---'
